services:
  - type: web
    name: notecraft-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STT_PROVIDER
        value: groq
      - key: STT_API_URL
        value: https://api.groq.com/openai/v1/audio/transcriptions
      - key: STT_MODEL
        value: whisper-large-v3-turbo
      - key: STT_TIMEOUT
        value: "120"
      - key: LLM_PROVIDER
        value: huggingface
      - key: LLM_API_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: LLM_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: LLM_TIMEOUT
        value: "300"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: STT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
